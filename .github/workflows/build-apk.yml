name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'android-twa/twa-manifest.json'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      - name: Fix cmdline-tools layout for Bubblewrap
        run: |
          echo "Isi cmdline-tools sebelum fix:"
          ls -la "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            VER=$(ls "$ANDROID_HOME/cmdline-tools" | grep -v latest | head -n1)
            echo "Membuat symlink latest -> $VER"
            ln -s "$ANDROID_HOME/cmdline-tools/$VER" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "Isi cmdline-tools sesudah fix:"
          ls -la "$ANDROID_HOME/cmdline-tools"

      - name: Pre-write Bubblewrap config (skip interactive first-run wizard)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << CONFIGEOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$ANDROID_HOME"}
          CONFIGEOF
          cat ~/.bubblewrap/config.json

      - name: Generate keystore (baru tiap build, gak butuh secret)
        run: |
          mkdir -p android-twa
          keytool -genkeypair -v \
            -keystore android-twa/android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass blockworld123 \
            -dname "CN=Julakk, OU=BlockWorld, O=Julakk, L=Unknown, S=Unknown, C=ID"

      - name: Generate Android project from twa-manifest.json
        working-directory: android-twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK/AAB
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: blockworld123
          BUBBLEWRAP_KEY_PASSWORD: blockworld123
        run: bubblewrap build --skipPwaValidation

      - name: Rename output
        working-directory: android-twa
        run: |
          cp app-release-signed.apk BlockWorld.apk
          cp app-release-bundle.aab BlockWorld.aab || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlockWorld Build ${{ github.run_number }}
          files: |
            android-twa/BlockWorld.apk
            android-twa/BlockWorld.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
