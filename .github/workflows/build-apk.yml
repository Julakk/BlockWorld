name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync web assets ke www/
        run: |
          mkdir -p www
          cp index.html three.min.js www/

      - name: Tanam nomor build ke game
        run: sed -i "s/__PM_BUILD__/${{ github.run_number }}/" www/index.html

      - name: Set versi APK (versionCode = run number, versionName = versi game)
        run: |
          VER=$(grep -oE "var VER = 'v[0-9]+(\.[0-9]+)*'" index.html | head -1 | grep -oE "[0-9]+(\.[0-9]+)*")
          echo "VERSION_NAME=${VER:-1.0}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Versi APK: ${VER:-1.0} (code ${{ github.run_number }})"

      - name: Add Android platform if missing
        run: test -d android || npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "fingerprint" || true
          else
            echo "Secret DEBUG_KEYSTORE_B64 kosong, pakai debug key acak"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/PancingMania-v${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PancingMania-apk
          path: dist/PancingMania-v${{ env.VERSION_NAME }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pancing Mania v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})
          files: dist/PancingMania-v${{ env.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
